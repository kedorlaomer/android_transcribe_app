[package]
name = "android_transcribe_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
cpal = "0.15"
log = "0.4"
android_logger = "0.13"
anyhow = "1.0"
transcribe-cpp = "0.4.0"
jni = "0.21"
libc = "0.2"
once_cell = "1.19"
crossbeam-channel = "0.5"

[features]
# NPU build (npu/build-npu-apk.sh): Whisper on the Qualcomm Hexagon NPU through
# ONNX Runtime's QNN execution provider. Needs QNN_ORT_DIR at build time.
qnn = ["dep:cc"]

[build-dependencies]
cc = { version = "1.2", optional = true }

